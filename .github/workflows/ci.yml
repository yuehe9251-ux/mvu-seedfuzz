name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit self-check
        run: npm test
      - name: Run minimal-rpg oracle selftest
        run: npm run selftest
      - name: Run SillyTavern template oracle selftest
        run: node src/cli.mjs selftest --preset presets/sillytavern-card-template.mjs
